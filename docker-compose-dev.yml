networks:
  internal:
    driver: bridge
  public:
    driver: bridge

services:

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    command: sh -c "npm run devmode -- --host 0.0.0.0"
    container_name: enlaight_frontend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Backend (Django)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enlaight-service
    container_name: enlaight_backend
    working_dir: /src
    command: ["sh", "/scripts/run.sh"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      REACT_URL: ${REACT_URL}
      
      POSTGRES_DB: ${BACKEND_DB}
      POSTGRES_USER: ${BACKEND_DB_USER}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      N8N_BASE_URL: ${N8N_BASE_URL}
      N8N_KB_KEY: ${N8N_KB_KEY}
      N8N_TIMEOUT: ${N8N_TIMEOUT}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      DEBUG: ${DEBUG}
    volumes:
      - ./backend/src:/src
      - ./backend/tests:/tests
      - ./backend/scripts:/scripts
      - ./n8n:/app/n8n
    networks:
      - internal
      - public

  # Email service
  smtp:
    image: rnwood/smtp4dev
    container_name: smtp4dev
    restart: unless-stopped
    ports:
      - "3000:80"
      - "2525:25"
    networks:
      - internal
      - public

  # Databases
  postgres:
    image: postgres:15
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BACKEND_DB}
      POSTGRES_USER: ${BACKEND_DB_USER}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER} -d ${BACKEND_DB} -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enlaight_cache
    restart: unless-stopped
    volumes:
      - redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # N8N
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.113.0
    container_name: n8n_dev
    restart: always
    ports:
      - "${N8N_BIND_HOST:-127.0.0.1}:5678:5678"
    environment:
      - NODE_ENV=development
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - GENERIC_TIMEZONE=UTC

      - N8N_CORS_ALLOW_ORIGIN=*
      - N8N_EDITOR_BASE_URL=http://localhost:5678

      - N8N_RUNNERS_ENABLED=true
      # Security: sandbox Execute Code nodes from the container env.
      # Set to "false" only if a workflow legitimately needs process.env access.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true

      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_enlaight_db
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - DB_POSTGRESDB_SSL_ENABLED=false
      
      - N8N_RUN_MIGRATIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/local-files:/files
      - ./n8n/scripts:/home/node/n8n-scripts
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
  
  quickchart:
    image: ianw/quickchart:latest
    ports:
      - "8001:3400"
    restart: unless-stopped
    networks:
      - public

volumes:
  n8n_data:
  redis:
    external: false
