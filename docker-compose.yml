networks:
  internal:
    driver: bridge
  public:
    driver: bridge
  default:
    name: superset_network

services:

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    command: sh -c "npm run devmode -- --host 0.0.0.0"
    container_name: enlaight_frontend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300

  # Backend (Django)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enlaight-service
    container_name: enlaight_backend
    working_dir: /src
    command: ["sh", "/scripts/run.sh"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      REACT_URL: ${REACT_URL}
      
      POSTGRES_DB: ${BACKEND_DB}
      POSTGRES_USER: ${BACKEND_DB_USER}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      N8N_BASE_URL: ${N8N_BASE_URL}
      N8N_KB_KEY: ${N8N_KB_KEY}
      N8N_TIMEOUT: ${N8N_TIMEOUT}
      # Set to False in .env for local development -> HTTP - PROD must be True -> HTTPS
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      DEBUG: ${DEBUG}
    volumes:
      - ./backend/src:/src
      - ./backend/tests:/tests
      - ./backend/scripts:/scripts
      - ./n8n:/app/n8n
    networks:
      - internal
      - public

  # Email service
  smtp:
    image: rnwood/smtp4dev
    container_name: smtp4dev
    restart: unless-stopped
    ports:
      - "3000:80"
      - "2525:25"
    networks:
      - internal
      - public
  
  # Databases
  postgres:
    image: postgres:15
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BACKEND_DB}
      POSTGRES_USER: ${BACKEND_DB_USER}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/sql-init:ro
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER} -d ${BACKEND_DB} -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enlaight_cache
    restart: unless-stopped
    volumes:
      - redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # N8N
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.113.0
    container_name: n8n_dev
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Core
      - NODE_ENV=development
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=UTC

      # Auth / dev convenience
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false

      # Database (LOCAL ONLY)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_enlaight_db
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_dev_password
      - DB_POSTGRESDB_SSL_ENABLED=false

      - N8N_RUN_MIGRATIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/local-files:/files
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.localhost`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${N8N_SSL_HOST}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
  
  traefik:
    image: traefik:v3.0
    container_name: traefik_dev
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
      - internal

volumes:
  postgres_data:
  n8n_data:
  redis:
    external: false
