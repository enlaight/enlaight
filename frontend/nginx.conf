server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    location /quickchart-public/ {
        proxy_pass https://quickchart.io/;
        proxy_set_header Host quickchart.io;
        proxy_ssl_server_name on;
        proxy_ssl_name quickchart.io;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # The self-hosted renderer, the production half of what vite.config.ts
    # proxies in dev. Without this, /charts/chart falls through to the SPA
    # route below and <img src="/charts/chart?..."> loads index.html as an
    # image, so every dashboard chart handed to an assistant renders broken.
    #
    # The upstream goes through a variable on purpose. nginx resolves a
    # literal proxy_pass host at config load, and nothing orders the
    # frontend service after quickchart, so a literal name turns "quickchart
    # is not up yet" into "nginx refuses to start" — a worse failure than
    # the one being fixed. A variable defers it to request time, using the
    # resolver declared above.
    #
    # A variable also means proxy_pass no longer strips the location prefix,
    # which is what the rewrite does instead: it is the equivalent of
    # vite.config.ts's `rewrite: path.replace(/^\/charts/, '')`. Drop it and
    # QuickChart receives /charts/chart instead of /chart.
    #
    # `set` must come BEFORE the rewrite: both are rewrite-module directives in
    # the same phase, and `rewrite ... break` ends that phase, so a `set` after
    # it never runs. Getting this backwards leaves the variable empty and nginx
    # answers 500: "using uninitialized quickchart_upstream variable", then
    # "invalid URL prefix". Measured, not guessed.
    location /charts/ {
        set $quickchart_upstream http://quickchart:3400;
        rewrite ^/charts/(.*)$ /$1 break;
        proxy_pass $quickchart_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
